# Intégration continue : à chaque pull request, on vérifie le style et on lance les tests.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: alumni
          POSTGRES_USER: alumni
          POSTGRES_PASSWORD: alumni-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alumni -d alumni"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30

    env:
      DJANGO_SECRET_KEY: ci-cle-factice
      POSTGRES_DB: alumni
      POSTGRES_USER: alumni
      POSTGRES_PASSWORD: alumni-ci
      POSTGRES_HOST: localhost

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Style
        run: |
          ruff check .
          ruff format --check .
      - name: Migrations à jour
        run: python manage.py makemigrations --check --dry-run
      - name: Tests
        run: python manage.py test
